name: Release

# Versions the packages and creates the release tags and GitHub Releases. Nothing goes to
# npm: every package.json is private and exists only so changesets can track a version.
# The GitHub Release of the anchor package starts nuget-publish.yml, which pushes to
# nuget.org.
#
# The work is split into two jobs. `prepare` decides what the run does. While changesets
# are pending, it versions the packages, restores the solution to update the lock files and
# uploads the changed files, with a GITHUB_TOKEN that only reads. `release` is the only job
# with the App token. It runs no restore and no build: it applies the uploaded changes after
# checking each one and opens or updates the version PR, or it tags the release. A restore
# can run MSBuild code from NuGet packages, so code from the dependency tree never runs next
# to the App token.
on:
  push:
    branches:
      - main
      - "release/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  prepare:
    name: Prepare version changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The changelog generator looks up the pull request and author of each changeset.
      pull-requests: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      # Full history, so changeset version finds the commit that added each changeset.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache in a release job: a cache written by another workflow must not feed a release.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Activates the pnpm version pinned in package.json's "packageManager".
      - name: Enable Corepack
        run: corepack enable

      # The root dependencies are the changesets CLI only, and nothing here needs an install script.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The same step as in the release job, so both jobs see the same pending changesets.
      - name: Set aside empty-only changesets
        run: |
          shopt -s nullglob
          pending=()
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = README.md ] || pending+=("$f")
          done
          [ "${#pending[@]}" -eq 0 ] && exit 0
          releases=$(awk '{ sub(/\r$/, "") } FNR == 1 { fm = ($0 == "---"); next } fm && $0 == "---" { fm = 0 } fm && NF { n++ } END { print n + 0 }' "${pending[@]}")
          if [ "$releases" -eq 0 ]; then
            echo "Only empty changesets are pending, setting aside: ${pending[*]}"
            rm -- "${pending[@]}"
          fi

      # mode is `version` while changesets with releases are pending, which is the same test
      # changesets/action makes in the release job before it versions. Otherwise nothing is
      # prepared, and the release job tags what is not tagged yet.
      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # scripts/sync-versions.mjs restores the solution so that the version PR also
      # updates the lock files.
      - name: Setup .NET
        if: steps.select-mode.outputs.mode == 'version'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # changeset version, the version sync into the .csproj files and the restore. The
      # changelog generator needs GITHUB_TOKEN, which can only read in this job.
      - name: Version packages
        if: steps.select-mode.outputs.mode == 'version'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-versions.mjs

      # Records every file the version step changed, added or deleted. It fails on a change
      # the release job would reject, so the run stops here and names the file.
      - name: Collect version changes
        if: steps.select-mode.outputs.mode == 'version'
        env:
          VERSION_CHANGES: ${{ runner.temp }}/version-changes/version-changes.json
        run: node scripts/version-changes.mjs collect

      # The release job runs right after this one. One day leaves time to re-run it alone.
      - name: Upload version changes
        if: steps.select-mode.outputs.mode == 'version'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-changes
          path: ${{ runner.temp }}/version-changes/version-changes.json
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release
    needs: prepare
    runs-on: ubuntu-latest
    # Every write (version PR, release commit, tags, GitHub Releases, release branches) goes
    # through the App token, so GITHUB_TOKEN only reads. Downloading an artifact of the same
    # run needs no permission.
    permissions:
      contents: read
    steps:
      # A GitHub App token (not GITHUB_TOKEN), so that the version PR, the release commit and the
      # GitHub Releases start the workflows they trigger (CI, NuGet Publish).
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHANGESETS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # changesets/action pushes the version branch, tags and releases with its github-token
      # input, so the checkout keeps no credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache in a release job: a cache written by another workflow must not feed a release.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Activates the pnpm version pinned in package.json's "packageManager".
      - name: Enable Corepack
        run: corepack enable

      # changeset publish, which creates the tags, runs from node_modules. Nothing here needs an
      # install script.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # changesets/action does nothing while only empty changesets are pending, even when
      # package.json holds versions that are not released yet (src/index.ts in v2.1.2).
      # When every pending changeset is empty, this checkout drops them so the action
      # releases those versions. The files stay in the repository, and the next Version
      # Packages PR consumes them.
      - name: Set aside empty-only changesets
        run: |
          shopt -s nullglob
          pending=()
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = README.md ] || pending+=("$f")
          done
          [ "${#pending[@]}" -eq 0 ] && exit 0
          releases=$(awk '{ sub(/\r$/, "") } FNR == 1 { fm = ($0 == "---"); next } fm && $0 == "---" { fm = 0 } fm && NF { n++ } END { print n + 0 }' "${pending[@]}")
          if [ "$releases" -eq 0 ]; then
            echo "Only empty changesets are pending, setting aside: ${pending[*]}"
            rm -- "${pending[@]}"
          fi

      # Outside the checkout, so the version commit cannot pick up the file itself.
      - name: Download version changes
        if: needs.prepare.outputs.mode == 'version'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-changes
          path: ${{ runner.temp }}/version-changes

      # While changesets are pending, the version script only writes the changes the prepare
      # job uploaded, after checking each one against the files a version bump touches, and
      # the action commits them to the version PR. The private packages are only tagged
      # (privatePackages.tag in .changeset/config.json). No npm dist-tag is passed on
      # release/** branches, because nothing goes to npm.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          VERSION_CHANGES: ${{ runner.temp }}/version-changes/version-changes.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: node scripts/version-changes.mjs apply
          publish-script: pnpm exec changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      - name: Create release branch on major version bump
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
            if (!published.length) return;

            // Only a stable N.0.0 release starts a new major. Prereleases, 0.x versions and
            // every later release of the same major leave the release branches alone.
            const newVersion = published[0].version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!newVersion) return;
            const [newMajor, newMinor, newPatch] = newVersion.slice(1).map(Number);
            if (newMajor < 1 || newMinor !== 0 || newPatch !== 0) return;

            const prevMajor = newMajor - 1;
            const branchName = `release/v${prevMajor}.x`;

            // Check if the branch already exists
            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName,
              });
              console.log(`Branch ${branchName} already exists, skipping.`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Find the last tag for the previous major version
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Newest stable release of the previous major. Only <package>@X.Y.Z tags of the
            // packages just published count, so tags from an earlier release tool (v1.2.3,
            // 1.2.3) or from before a package rename never match. Versions are compared
            // numerically because the tag list API does not return tags in version order.
            const publishedNames = new Set(published.map(p => p.name));
            const prevTag = tags
              .map(t => {
                const match = t.name.match(/^(.+)@(\d+)\.(\d+)\.(\d+)$/);
                if (!match || !publishedNames.has(match[1])) return null;
                return { tag: t, version: [match[2], match[3], match[4]].map(Number) };
              })
              .filter(c => c && c.version[0] === prevMajor)
              .sort((a, b) => b.version[1] - a.version[1] || b.version[2] - a.version[2])[0]?.tag;

            if (!prevTag) {
              console.log(`No tag found for v${prevMajor}, skipping branch creation.`);
              return;
            }

            // Create the branch from the previous major's last tag
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: prevTag.commit.sha,
              });
              console.log(`Created ${branchName} from tag ${prevTag.name} (${prevTag.commit.sha}).`);
            } catch (e) {
              // GitHub can refuse to create a branch from an older commit (403). The release
              // itself already succeeded, so warn with the manual command instead of failing.
              if (e.status !== 403) throw e;
              core.warning(
                `Could not create ${branchName} from ${prevTag.name}: ${e.message}. ` +
                  `Create it by hand: git push origin ${prevTag.commit.sha}:refs/heads/${branchName}`,
              );
            }
